# 도커 이미지 CI/CD → GitHub Container Registry(GHCR)
#  - PR        : 테스트 + 이미지 빌드·스모크 테스트만 (푸시 안 함)
#  - main push : 테스트 통과 시 ghcr.io/<owner>/steganography:main, :sha-<커밋> 푸시
#  - v* 태그   : 테스트 통과 시 :<버전>(예 5.0.0), :latest 푸시  (Windows exe 릴리스는 release.yml이 별도 수행)
# 인증은 내장 GITHUB_TOKEN만 사용 — 별도 시크릿 불필요.
name: Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Gitleaks가 전체 기록을 보도록
      # 커밋 기록 전체에서 비밀키 검사 (태그 변조에 대비해 다이제스트로 고정, v8.30.1)
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner --verbose
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 이미지 이름은 소문자만 허용 (저장소명 Steganography → steganography)
      - name: 이미지 이름
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # 1) 로컬로 빌드해서 실제로 띄워 본다 — 깨진 이미지는 레지스트리에 올리지 않음
      - name: 빌드 (스모크 테스트용)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: steg-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 스모크 테스트 (CLI + 웹 UI 응답)
        run: |
          docker run --rm steg-studio:ci --version
          docker run -d --name web -p 127.0.0.1:47821:47821 steg-studio:ci web --host 0.0.0.0
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:47821/ -o /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:47821/ | grep -q "포렌식 보안 스튜디오"
          printf 'hello' > /tmp/t.txt
          curl -fsS -X POST --data-binary @/tmp/t.txt -H "X-Filename: t.txt" http://127.0.0.1:47821/api/scan | grep -q '"verdict"'
          docker rm -f web

      # 1-2) 취약점·비밀키 검사 — 전체(HIGH 이상)는 보고만, 수정판이 나온 CRITICAL은 배포 차단 (v0.76.2 다이제스트 고정)
      - name: Trivy
        run: |
          docker save steg-studio:ci -o /tmp/image.tar
          trivy() {
            docker run --rm -v /tmp/image.tar:/image.tar:ro -v trivy-cache:/root/.cache               ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb               image --input /image.tar --scanners vuln,secret --timeout 15m "$@"
          }
          trivy --severity HIGH,CRITICAL
          trivy --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet
          rm /tmp/image.tar

      # 1-3) 은닉·악성 파일 게이트: 정상 파일은 0, 검사 불가(폴더 없음)는 2로 끝나야 한다
      - name: batch --fail-on 종료코드 확인
        run: |
          mkdir -p /tmp/gate && printf 'hello' > /tmp/gate/t.txt
          docker run --rm -v /tmp/gate:/data:ro steg-studio:ci batch /data -r --fail-on critical
          rc=0; docker run --rm steg-studio:ci batch /no-such-dir --fail-on critical || rc=$?
          test "$rc" -eq 2

      # 2) PR이 아니면 GHCR에 푸시 (캐시 재사용이라 재빌드는 빠름)
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - if: github.event_name != 'pull_request'
        name: 요약
        run: |
          echo "### 푸시된 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "실행: \`docker run --rm -p 127.0.0.1:47821:47821 ${IMAGE}:main web --host 0.0.0.0\`" >> "$GITHUB_STEP_SUMMARY"
